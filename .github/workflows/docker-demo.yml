name: Build and push demo Docker image

# Only build when the dockerfile has changed, otherwise scheduled every two weeks
# (on the 1st and 15th every month) since it's not so important to keep this image
# exactly in sync with master
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'extras/docker/demo/Dockerfile'
      - '.github/workflows/docker-demo.yml'
  schedule:
    - cron: '0 6 1,15 * *'

env:
  REGISTRY_REPO: ${{ vars.REGISTRY_REPO || format('ghcr.io/{0}', github.repository) }}

jobs:
  demo:
    name: Build demo image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to DockerHub (optional)
        if: env.HAS_DOCKERHUB == 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: extras/docker/demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY_REPO }}/demo:latest,${{ env.REGISTRY_REPO }}/demo:2.4-dev

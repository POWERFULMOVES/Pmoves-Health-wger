# PMOVES-Health-wger - Multi-arch Docker Build
# Builds PMOVES-branded wger image for amd64 and arm64

name: Build and push PMOVES production Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  # PMOVES branded image names
  DOCKERHUB_IMAGE: powerfulmoves/pmoves-health-wger
  GHCR_IMAGE: ghcr.io/powerfulmoves/pmoves-health-wger
  VERSION: pmoves-latest

jobs:
  build-prod:
    name: Build production image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: pmoves-wger-buildx-${{ matrix.platform }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            pmoves-wger-buildx-${{ matrix.platform }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_VERSION=${{ env.VERSION }}" >> $GITHUB_ENV

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ matrix.platform }}
          labels: |
            maintainer=PMOVES.AI <ops@cataclysmstudios.com>
            description=PMOVES-enhanced wger fitness tracker
            org.pmoves.version=${{ env.VERSION }}
            org.pmoves.mode=standalone-docked
            org.pmoves.build-date=${{ env.BUILD_DATE }}
            org.pmoves.commit=${{ env.BUILD_COMMIT }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_VERSION=${{ env.BUILD_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  merge:
    runs-on: ubuntu-latest
    needs:
      - build-prod
    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and tag for Docker Hub
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t powerfulmoves/pmoves-health-wger:${{ env.VERSION }} \
            -t powerfulmoves/pmoves-health-wger:latest \
            $(printf 'powerfulmoves/pmoves-health-wger@sha256:%s ' *)

      - name: Create manifest and tag for GHCR
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t ghcr.io/powerfulmoves/pmoves-health-wger:${{ env.VERSION }} \
            -t ghcr.io/powerfulmoves/pmoves-health-wger:latest \
            $(printf 'ghcr.io/powerfulmoves/pmoves-health-wger@sha256:%s ' *)

      - name: Inspect Docker Hub image
        run: |
          docker buildx imagetools inspect powerfulmoves/pmoves-health-wger:${{ env.VERSION }}

      - name: Inspect GHCR image
        run: |
          docker buildx imagetools inspect ghcr.io/powerfulmoves/pmoves-health-wger:${{ env.VERSION }}
